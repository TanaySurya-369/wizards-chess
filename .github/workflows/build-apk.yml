name: Build Wizards Chess APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Android APK with Cordova
        run: |
          npm install -g cordova
          cordova create app com.sanctuary.wizardschess "WizardsChess"
          
          # Find your HTML file anywhere in the repo and copy it into the app
          HTML_FILE=$(find . -maxdepth 2 -name "*.html" ! -path "./app/*" | head -n 1)
          cp "$HTML_FILE" app/www/index.html
          
          cd app
          cordova platform add android@13.0.0
          cordova build android --debug -- --packageType=apk

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Wizards-Chess-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
